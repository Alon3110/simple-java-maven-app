name: CI/CD Pipeline

on:
  push:
    branches: [ "pipeline" ]

permissions:
  contents: write

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Bump patch version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"

          mvn versions:set -DnewVersion=$NEW_VERSION -DgenerateBackupPoms=false

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pom.xml
          git commit -m "Bump version to $NEW_VERSION [skip ci]"
          git push

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ steps.version.outputs.new_version }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest .

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ steps.version.outputs.new_version }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
