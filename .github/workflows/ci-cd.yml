name: CI/CD Pipeline

on:
  push:
    branches: [ "pipeline" ]

permissions:
  contents: write

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Bump patch version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"

          mvn versions:set -DnewVersion=$NEW_VERSION -DgenerateBackupPoms=false

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add pom.xml
          git commit -m "Bump version to $NEW_VERSION [skip ci]"
          git push

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ steps.version.outputs.new_version }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest .

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ steps.version.outputs.new_version }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest


      - name: Check secrets
        run: |
          test -n "${{ secrets.SERVER_HOST }}"
          test -n "${{ secrets.SERVER_USER }}"
          test -n "${{ secrets.SERVER_SSH_KEY }}"

      - name: Setup ssh key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          ls -la ~/.ssh

      - name: Deploy image
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            docker pull ${{ secrets.DOCEKR_USERNAME }}/my-app:latest &&
            docker stop my-app || true &&
            docker rm my-app || true &&
            docker run -d --name my-app -p 8080:8000 ${{ secrets.DOCKER_USERNAME }}/my-app:latest
          "

      - name: Verify app
        run: |
          sleep 10
          curl -f http://${{ secrets.SERVER_HOST }}:8080
